name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check AutoAudit

      - name: Type check (mypy)
        run: mypy AutoAudit/app || true   # 점진 도입: 실패 비차단

      - name: Test (pytest)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend (OpenAPI 추출용)
        working-directory: .
        run: pip install -r requirements.txt

      - run: npm ci

      - name: API 타입 동기화 검증 (gen 후 diff 없어야 함)
        run: |
          npm run gen:api
          git diff --exit-code src/types.gen.ts \
            || (echo "::error::types.gen.ts가 최신이 아닙니다. 'npm run gen:api' 실행 후 커밋하세요." && exit 1)

      - run: npm run build
